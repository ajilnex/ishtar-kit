name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Le code exige le SDK macOS 26 (Vision RecognizeDocumentsRequest) : Xcode 26, donc macos-26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
